# Faster escape for vim
set -sg escape-time 0

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",screen-256color:Tc"
set -g set-clipboard on
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'Morantron/tmux-fingers'

# Resurrect & Continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Sessionx settings
set -g @sessionx-bind 'o'

# Fingers settings
set -g @fingers-key F

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Let tmux-yank handle clipboard integration
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Red/Black theme
set -g status-style 'bg=#000000 fg=#ffffff'
set -g status-left '#[bg=#ff0000,fg=#000000,bold] #S #[bg=#000000] '
set -g status-left-length 30
set -g status-right '#[fg=#888888]%H:%M #[bg=#111111,fg=#ffffff] %Y-%m-%d #[bg=#ff0000,fg=#000000,bold] #H '
set -g status-right-length 50

# Window status
set -g window-status-format '#[fg=#888888] #I:#W '
set -g window-status-current-format '#[bg=#ff0000,fg=#000000,bold] #I:#W '
set -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#ff0000'

# Message style
set -g message-style 'bg=#ff0000 fg=#000000 bold'

# Set plugin path to dotfiles (Nix doesn't follow git submodules)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/dotfiles/.config/tmux/plugins'
run '~/dotfiles/.config/tmux/plugins/tpm/tpm'
