# Autostart applications

# Session setup
exec-once = dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target

# Lock on start
exec-once = hyprlock || hyprctl dispatch exit

# System services
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = gnome-keyring-daemon --start --components=secrets,ssh

# UI
exec-once = waybar
exec-once = hyprpaper
exec-once = setcursor Future-Cyan-Hyprcursor_Theme 40
exec-once = blueman-applet

# Initialize workspaces
exec-once = sh -c 'sleep 0.5 && hyprctl dispatch workspace 1 && hyprctl dispatch workspace 2 && hyprctl dispatch workspace 3 && hyprctl dispatch workspace 4 && hyprctl dispatch workspace 5'

# Startup apps
exec-once = [workspace 1 silent] ghostty
exec-once = [workspace 2 silent] brave
exec-once = [workspace 4 silent] spotify
