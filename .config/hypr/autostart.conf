# Autostart applications

# Session setup
exec-once = dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target

# Lock on start
exec-once = hyprlock || hyprctl dispatch exit

# System services
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = gnome-keyring-daemon --start --components=secrets,ssh

# UI (waybar started via home-manager systemd service)
exec-once = hyprpaper

# Bind workspaces to external monitor if available, else laptop
exec-once = sleep 0.5 && { ext=$(hyprctl monitors -j | jq -r '.[] | select(.name != "eDP-1") | .name' | head -1); mon=${ext:-eDP-1}; for ws in 1 2 3 4; do hyprctl keyword workspace "$ws, monitor:$mon"; done; }
exec-once = setcursor Future-Cyan-Hyprcursor_Theme 40
exec-once = blueman-applet

# Window rules for workspace assignment
windowrule = match:class com.mitchellh.ghostty, workspace 1 silent
windowrule = match:class brave-browser, workspace 2 silent
windowrule = match:class spotify, workspace 3 silent
windowrule = match:class 1password, workspace 4 silent

# Startup apps (delay for UWSM session readiness)
exec-once = sleep 1 && ghostty
exec-once = sleep 1 && brave
exec-once = sleep 1 && spotify
exec-once = sleep 1 && 1password
