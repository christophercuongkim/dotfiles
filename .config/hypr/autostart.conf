# Autostart applications

# Session setup
exec-once = dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target

# System services (start before lock)
exec-once = systemctl --user start hyprpolkitagent
exec-once = mako
exec-once = hypridle
exec-once = gnome-keyring-daemon --start --components=secrets,ssh
exec-once = hyprpaper
exec-once = setcursor Future-Cyan-Hyprcursor_Theme 40
exec-once = blueman-applet

# Lock on start, then launch apps after unlock
# Phase 1: Lock and bind workspaces to monitor
exec-once = hyprlock || hyprctl dispatch exit && sleep 0.5 && { ext=$(hyprctl monitors -j | jq -r '.[] | select(.name != "eDP-1") | .name' | head -1); mon=${ext:-eDP-1}; for ws in 1 2 3 4; do hyprctl keyword workspace "$ws, monitor:$mon"; done; }

# Phase 2: Launch apps (staggered to avoid races)
exec-once = sleep 1 && ghostty
exec-once = sleep 1.5 && brave
exec-once = sleep 2 && spotify
exec-once = sleep 2.5 && 1password

# Phase 3: Move windows to workspaces after they exist (generous delay for slow apps)
exec-once = sleep 5 && hyprctl dispatch movetoworkspacesilent 1,class:com.mitchellh.ghostty
exec-once = sleep 6 && hyprctl dispatch movetoworkspacesilent 2,class:brave-browser
exec-once = sleep 7 && hyprctl dispatch movetoworkspacesilent 3,class:spotify
exec-once = sleep 8 && hyprctl dispatch movetoworkspacesilent 4,class:1password
