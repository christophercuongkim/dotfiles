# Monitor configuration

# Laptop display (scaled for HiDPI)
monitor = eDP-1, preferred, 0x0, 1.5

# All other monitors: high refresh rate, auto-position to the left
monitor = , highrr, auto-left, 1


# Lid switch - disable laptop display when closed
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, sleep 0.5 && hyprctl keyword monitor "eDP-1, preferred, 0x0, 1.5" && hyprctl dispatch dpms on eDP-1
