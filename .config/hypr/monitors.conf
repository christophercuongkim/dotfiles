# Monitor configuration

# Laptop display (scaled for HiDPI)
monitor = eDP-1, preferred, 0x0, 1.5

# All other monitors: high refresh rate, auto-position to the left
monitor = , highrr, auto-left, 1


# Lid switch - disable laptop display only when an external monitor is present.
# Disabling the sole output leaves it black on lid open; script guards on that.
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh open
