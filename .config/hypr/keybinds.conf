# Keybindings

# Apps
bind = $mod, Return, exec, $terminal
bind = $mod, B, exec, firefox
bind = $mod, grave, exec, hyprlock
bind = $mod, space, exec, rofi -show drun
bind = $mod SHIFT, s, exec, HYPRSHOT_DIR='/home/chriskim/Pictures/screen_shots' $ss -m region

# Focus (vim-style)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Windows
bind = $mod, X, killactive
bind = $mod, f, fullscreen, 0
bind = $mod, V, togglefloating

# Float move/resize (hold $mod + drag)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspaces - switch
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

# Workspaces - move window
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Workspaces - relative navigation
bind = $mod SHIFT, H, movetoworkspace, -1
bind = $mod SHIFT, L, movetoworkspace, +1
bind = $mod SHIFT, J, movetoworkspace, e+1
bind = $mod SHIFT, K, movetoworkspace, e-1
bind = $mod, N, workspace, empty
bind = $mod SHIFT, N, workspace, empty:-1
bind = $mod, Tab, workspace, m+1
bind = $mod SHIFT, Tab, workspace, m-1

# Monitor focus (vim-style directional)
bind = $mod CTRL, H, focusmonitor, l
bind = $mod CTRL, L, focusmonitor, r
bind = $mod CTRL, J, focusmonitor, d
bind = $mod CTRL, K, focusmonitor, u
bind = $mod CTRL, Tab, focusmonitor, +1
bind = $mod CTRL SHIFT, Tab, focusmonitor, -1

# Move workspace to monitor
bind = $mod ALT, H, movecurrentworkspacetomonitor, l
bind = $mod ALT, L, movecurrentworkspacetomonitor, r
bind = $mod ALT, J, movecurrentworkspacetomonitor, d
bind = $mod ALT, K, movecurrentworkspacetomonitor, u
bind = $mod ALT, Tab, movecurrentworkspacetomonitor, +1
bind = $mod ALT SHIFT, Tab, movecurrentworkspacetomonitor, -1

# Swap workspaces between monitors
bind = $mod SHIFT, Tab, swapactiveworkspaces, current +1

# Swap external monitor positions
bind = $mod, M, exec, ~/.config/hypr/scripts/swap-monitors.sh

# Toggle trackpad
bind = $mod SHIFT, T, exec, ~/.config/hypr/scripts/toggle-trackpad.sh

# Window resizing
bind = $mod CTRL, right, resizeactive, 20 0
bind = $mod CTRL, left, resizeactive, -20 0
bind = $mod CTRL, up, resizeactive, 0 -20
bind = $mod CTRL, down, resizeactive, 0 20

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bind = $mod, XF86AudioPlay, exec, spotify

# Brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
