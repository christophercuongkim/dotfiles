# Red/Black theme for oh-my-posh
console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[secondary_prompt]
  template = '❯❯ '
  foreground = 'red'
  background = 'transparent'

[transient_prompt]
  template = '❯ '
  background = 'transparent'
  foreground_templates = ['{{if gt .Code 0}}#ff4444{{end}}', '{{if eq .Code 0}}red{{end}}']

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = ' {{.Icon}} '
    foreground = '#ffffff'
    background = '#ff0000'
    type = 'os'
    style = 'diamond'
    leading_diamond = ''
    trailing_diamond = ''

    [blocks.segments.properties]
      cache_duration = '1h'

  [[blocks.segments]]
    template = '{{ if .SSHSession }} 󱘖 {{ end }}{{ .UserName }}@{{ .HostName }} '
    foreground = '#ffffff'
    background = '#111111'
    type = 'session'
    style = 'powerline'
    powerline_symbol = ''

    [blocks.segments.properties]
      cache_duration = '1h'

  [[blocks.segments]]
    template = '  {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if gt .Working.Untracked 0 }} 󰝒 {{ .Working.Untracked }}{{ end }}{{ if gt .Working.Modified 0 }} 󰷈 {{ .Working.Modified }}{{ end }}{{ if gt .Working.Deleted 0 }} 󰮘 {{ .Working.Deleted }}{{ end }}{{ if gt .Staging.Added 0 }} 󰐗 {{ .Staging.Added }}{{ end }}{{ if gt .Staging.Modified 0 }} 󰄬 {{ .Staging.Modified }}{{ end }}{{ if gt .StashCount 0 }} 󰆓 {{ .StashCount }}{{ end }} '
    foreground = '#ffffff'
    background = '#cc0000'
    type = 'git'
    style = 'powerline'
    powerline_symbol = ''
    background_templates = [
      '{{ if or (.Working.Changed) (.Staging.Changed) }}#990000{{ end }}',
      '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#aa0000{{ end }}',
      '{{ if gt .Ahead 0 }}#006600{{ end }}',
      '{{ if gt .Behind 0 }}#cc0000{{ end }}'
    ]

    [blocks.segments.properties]
      fetch_status = true
      fetch_stash_count = true
      cache_duration = '5m'

  # Nix shell indicator (only shows in nix develop/nix-shell)
  [[blocks.segments]]
    template = '  nix '
    foreground = '#ffffff'
    background = '#7eb0d8'
    type = 'envvar'
    style = 'powerline'
    powerline_symbol = ''

    [blocks.segments.properties]
      var_name = 'IN_NIX_SHELL'
      cache_duration = 'none'

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = ' {{ .Path }} '
    foreground = '#888888'
    background = 'transparent'
    type = 'path'
    style = 'plain'

    [blocks.segments.properties]
      style = 'full'
      cache_duration = 'none'

[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  # Execution time
  [[blocks.segments]]
    template = ' 󱎫 {{ .FormattedMs }} '
    foreground = '#888888'
    background = 'transparent'
    type = 'executiontime'
    style = 'plain'

    [blocks.segments.properties]
      threshold = 2000
      cache_duration = 'none'

  # Python version
  [[blocks.segments]]
    template = '  {{ .Full }} '
    foreground = '#aaaaaa'
    background = 'transparent'
    type = 'python'
    style = 'plain'

    [blocks.segments.properties]
      fetch_virtual_env = true
      cache_duration = '10m'

  # Node version
  [[blocks.segments]]
    template = '  {{ .Full }} '
    foreground = '#44ff44'
    background = 'transparent'
    type = 'node'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = '10m'

  # Go version
  [[blocks.segments]]
    template = '  {{ .Full }} '
    foreground = '#00bfff'
    background = 'transparent'
    type = 'go'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = '10m'

  # Battery
  [[blocks.segments]]
    template = ' {{ if not .Error }}{{ .Icon }} {{ .Percentage }}%{{ end }} '
    foreground_templates = [
      '{{if lt .Percentage 20}}#ff4444{{end}}',
      '{{if lt .Percentage 50}}#ff9900{{end}}',
      '#44ff44'
    ]
    background = 'transparent'
    type = 'battery'
    style = 'plain'

    [blocks.segments.properties]
      display_charging = true
      charging_icon = '󰂄 '
      discharging_icon = '󰁹 '
      charged_icon = '󰁹 '
      cache_duration = '1m'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '❯'
    background = 'transparent'
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if gt .Code 0}}#ff4444{{end}}', '{{if eq .Code 0}}#ff0000{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'
